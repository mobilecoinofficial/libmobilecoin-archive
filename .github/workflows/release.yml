# Cut a release: build the xcframework, publish it as a checksummed asset, stamp
# release.env, tag, and push the pod.
#
# Runs on workflow_dispatch, not on a tag push, because the tagged commit has to
# already carry the asset checksum and that is only known after the Rust build.
# The workflow therefore builds first and creates the tag itself.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the archive without tagging or publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    # The Rust build covers five targets from a cold cache.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # The workflow commits the stamped release.env.
          fetch-depth: 0
          persist-credentials: true

      - name: Read release settings
        id: settings
        run: |
          set -euo pipefail
          . ./release.env
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse an existing tag
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "error: ${TAG} already exists. Bump VERSION in release.env." >&2
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      # The foundation tree carries its own Brewfile with protobuf and
      # openssl@1.1, neither of which is on the runner image. Fetch it first.
      - name: Fetch the pinned foundation revision
        run: make vendor

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew update-reset
          brew install llvm ninja pkg-config
          brew bundle --no-upgrade
          brew bundle --no-upgrade --file Vendor/mobilecoin/Brewfile

      - name: Install Rust
        run: |
          set -euo pipefail
          command -v rustup >/dev/null \
            || curl https://sh.rustup.rs --tlsv1.2 -sSf | sh -s -- -y --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      # Vendor/mobilecoin is fetched at the revision in Vendor/mobilecoin.rev,
      # so the cache key has to include it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libmobilecoin
          key: ${{ hashFiles('Vendor/mobilecoin.rev', 'libmobilecoin/Cargo.lock') }}

      - name: Build the xcframework
        run: make setup build clean-artifacts copy

      # Signing changes the bytes inside the xcframework, so it has to happen
      # before the archive is built and checksummed. It runs in a dry run too,
      # otherwise the whole signing path stays unexercised until a real release
      # and the dry run checksums an archive no release would ever publish.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12}" ]; then
            echo "error: APPLE_CERTIFICATE_P12 is not set, so the release cannot be signed" >&2
            exit 1
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${KEYCHAIN}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN}" login.keychain-db

      - name: Sign the xcframework
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_IDENTITY}" ]; then
            echo "error: APPLE_SIGNING_IDENTITY is not set" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            if codesign --force --timestamp --sign "${SIGNING_IDENTITY}" \
                 .build/mc-artifacts/LibMobileCoinLibrary.xcframework; then
              break
            fi
            if [ "${attempt}" = 5 ]; then
              echo "error: codesign failed 5 times; timestamp.apple.com may be down" >&2
              exit 1
            fi
            echo "codesign attempt ${attempt} failed, retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          codesign --verify --strict --verbose=2 \
            .build/mc-artifacts/LibMobileCoinLibrary.xcframework

      - name: Package and stamp release.env
        run: make stamp

      - name: Verify the archive matches the stamped checksum
        run: |
          set -euo pipefail
          . ./release.env
          echo "${XCFRAMEWORK_SHA256}  .build/LibMobileCoinLibrary.xcframework.zip" \
            | shasum -a 256 -c -

      # Two runs of the packager over one xcframework must agree, otherwise a
      # consumer can resolve a checksum the manifest never carried.
      - name: Verify the packaging is reproducible
        run: |
          set -euo pipefail
          FIRST="$(shasum -a 256 .build/LibMobileCoinLibrary.xcframework.zip | cut -d' ' -f1)"
          tools/package-xcframework.sh \
            .build/mc-artifacts/LibMobileCoinLibrary.xcframework \
            .build/repack.zip > /dev/null
          SECOND="$(shasum -a 256 .build/repack.zip | cut -d' ' -f1)"
          rm -f .build/repack.zip
          [ "$FIRST" = "$SECOND" ] || {
            echo "error: repacking the same xcframework changed the checksum" >&2
            echo "  first:  $FIRST" >&2
            echo "  second: $SECOND" >&2
            exit 1
          }

      # The packager rewrites mode and mtime on every file, so prove the seal
      # still verifies after a round trip through the archive.
      - name: Verify the signature survives the archive
        run: |
          set -euo pipefail
          UNPACKED="$(mktemp -d)"
          unzip -q .build/LibMobileCoinLibrary.xcframework.zip -d "${UNPACKED}"
          codesign --verify --strict --verbose=2 \
            "${UNPACKED}/LibMobileCoinLibrary.xcframework"

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibMobileCoinLibrary.xcframework.zip
          path: .build/LibMobileCoinLibrary.xcframework.zip
          retention-days: 7

      # Cheap, and it runs before anything is pushed. A dependency's manifest is
      # compiled through a VFS overlay with no rest of the checkout, so a file
      # read in it works at the repo root and fails for every consumer.
      - name: Assert the manifest evaluates as a dependency
        run: |
          set -euo pipefail
          . ./release.env
          DEP=$(mktemp -d)
          git clone --quiet --local . "$DEP/libmobilecoin"
          git -C "$DEP/libmobilecoin" tag -f "$VERSION"
          APP=$(mktemp -d)
          mkdir -p "$APP/Sources/App"
          echo 'public let a = 1' > "$APP/Sources/App/App.swift"
          cat > "$APP/Package.swift" <<EOF
          // swift-tools-version:5.7
          import PackageDescription
          let package = Package(
              name: "App",
              platforms: [.iOS(.v13), .macOS(.v11)],
              dependencies: [.package(url: "$DEP/libmobilecoin", exact: "$VERSION")],
              targets: [.target(name: "App")])
          EOF
          # resolve, not dump-package: dump-package reads only the ROOT manifest and
          # exits 0 even when the dependency's manifest cannot compile.
          # The artifact is not published yet at release time, so only a manifest
          # error is fatal here. The consumer resolve after publish covers the rest.
          cd "$APP"
          set +e
          swift package resolve > resolve.log 2>&1
          set -e
          if grep -q "Invalid manifest" resolve.log; then
            echo "error: the dependency manifest failed to compile under the VFS overlay" >&2
            cat resolve.log >&2
            exit 1
          fi

      - name: Commit the stamp and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.env Package.swift
          git diff --cached --quiet || git commit -m "chore: stamp release.env for ${TAG}"
          git tag "${TAG}"
          git push --atomic origin HEAD:master "refs/tags/${TAG}"

      - name: Create the release and upload the asset
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            .build/LibMobileCoinLibrary.xcframework.zip

      # Resolving from the published tag is the only check that proves a
      # consumer can install this release.
      - name: Resolve the published release as a consumer would
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          CONSUMER="$(mktemp -d)"
          mkdir -p "${CONSUMER}/Sources/Consumer"
          echo 'import LibMobileCoinCommon' > "${CONSUMER}/Sources/Consumer/Consumer.swift"
          cat > "${CONSUMER}/Package.swift" <<EOF
          // swift-tools-version:5.7
          import PackageDescription
          let package = Package(
              name: "Consumer",
              platforms: [.iOS(.v13), .macOS(.v11)],
              dependencies: [
                  .package(url: "https://github.com/${{ github.repository }}.git", exact: "${{ steps.settings.outputs.version }}")
              ],
              targets: [
                  .target(name: "Consumer", dependencies: [
                      .product(name: "LibMobileCoinCore", package: "libmobilecoin")
                  ])
              ]
          )
          EOF
          swift build --package-path "${CONSUMER}"

      - name: Publish the pod
        if: ${{ !inputs.dry_run }}
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: bundle exec pod trunk push LibMobileCoin.podspec --allow-warnings
